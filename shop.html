<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Coffee | ChitChat Coffee</title>
<meta name="description" content="Shop single estate roasted beans, filter coffee, pure coffee, brewing equipment and green coffee beans.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-page="shop">
<main class="page">
  <section class="container shop-hero">
    <div>
      <h1>Coffee from farm to cup</h1>
      <p>Speciality coffee from our estate: small-batch roasted, freshly packed.</p>
    </div>
    <div class="hero-pouches" id="heroPouches" aria-hidden="true"></div>
  </section>

  <div class="container toolbar">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
      <input type="search" id="q" placeholder="Search specialty coffees, origins, or flavour notes..." aria-label="Search coffees" autocomplete="off">
      <button id="qClear" class="is-hidden" aria-label="Clear search">✕</button>
    </div>
    <span class="count" id="count"></span>
    <label class="sort">sort by:
      <select id="sort" aria-label="Sort products">
        <option value="featured">featured</option>
        <option value="price-asc">price: low to high</option>
        <option value="price-desc">price: high to low</option>
        <option value="rating">top rated</option>
        <option value="name">name: A to Z</option>
      </select>
    </label>
  </div>

  <div class="cat-row" id="catRow"></div>

  <div class="container shop-layout">
    <aside class="filters" id="filters" aria-label="Filters"></aside>
    <section>
      <div class="active-filters" id="activeFilters"></div>
      <div class="pgrid" id="pgrid" aria-live="polite"></div>
      <button class="btn btn-dark load-more is-hidden" id="more"><span>Load more</span></button>
    </section>
  </div>
  <button class="filter-fab" id="fab">☰ Filters <b id="fabCount"></b></button>
</main>

<script src="products.js"></script>
<script src="app.js"></script>
<script src="shop.js"></script>
</body>
</html>
