<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | ChitChat Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-page="checkout">
<main class="page">
  <div class="stepper" aria-label="Checkout progress"><div class="done" data-n="1">Cart</div><div class="now" data-n="2" id="st2">Details</div><div data-n="3" id="st3">Payment</div><div data-n="4">Done</div></div>
  <div class="page-title"><h1>Checkout</h1></div>
  <div id="coRoot"></div>
</main>
<div class="processing" id="processing"><div><div class="spinner"></div><h3 style="font-size:26px">Roasting your order…</h3><p style="opacity:.7;margin-top:6px">Please don't close this window.</p></div></div>
<script src="products.js"></script>
<script src="app.js"></script>
<script src="checkout.js"></script>
</body>
</html>
